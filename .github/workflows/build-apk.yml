name: Build Persepolis Plus APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/ir/perspolisplus/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PersepolisPlus"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ir.perspolisplus.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'ir.perspolisplus.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="پرسپولیس پلاس"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C8102E</item>
                  <item name="android:statusBarColor">#160A10</item>
                  <item name="android:navigationBarColor">#160A10</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#13090F"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D20A32"
                  android:pathData="M54,8 L88,21 L84,57 C81,76 68,91 54,99 C40,91 27,76 24,57 L20,21 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M37,32 L48,32 L48,43 L62,43 L62,32 L73,32 L73,61 L62,61 L62,52 L48,52 L48,61 L37,61 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M44,69 L64,69 L64,75 L44,75 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M51,64 L57,64 L57,80 L51,80 Z"/>
          </vector>
          XML
          cat > app/src/main/java/ir/perspolisplus/app/MainActivity.java <<'JAVA'
          package ir.perspolisplus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.View;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(22,10,16));
                  getWindow().setNavigationBarColor(Color.rgb(22,10,16));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(17,12,17));
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setSupportZoom(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);

                  if (state == null) {
                      web.loadUrl("https://perspolisplus2026.github.io/persepolis-plus-2026/");
                  } else {
                      web.restoreState(state);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA


      - name: Generate real Persepolis launcher icons
        run: |
          python -m pip install cairosvg pillow
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
      cp file_000000004f2881f99e740fc3861644b8.png /tmp/persepolis-logo.png
          python -c "from PIL import Image; from pathlib import Path; im=Image.open('/tmp/persepolis-logo.png').convert('RGBA'); sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}; [(im.resize((n,n),Image.Resampling.LANCZOS).save(Path('app/src/main/res')/('mipmap-'+d)/'ic_launcher.png')) for d,n in sizes.items()]"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persepolis-Plus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
